<!DOCTYPE html>
<html lang="sq">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#3a1f2a" />
    <title>How well do you know me?</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,400&family=Outfit:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="sky" aria-hidden="true">
      <div class="glow glow-a"></div>
      <div class="glow glow-b"></div>
      <div class="hearts" id="hearts"></div>
    </div>

    <main class="shell">
      <section class="card" id="screen-start">
        <p class="kicker" id="kicker">për ty</p>
        <h1 id="title">How well do you know me?</h1>
        <p class="lede" id="intro"></p>
        <button type="button" class="btn primary" id="btn-start">Fillo kuizin</button>
      </section>

      <section class="card hidden" id="screen-quiz" aria-live="polite">
        <div class="quiz-top">
          <p class="progress-text" id="progress-text"></p>
          <div class="dots" id="dots"></div>
        </div>
        <h2 class="question" id="question"></h2>
        <div class="choices" id="choices"></div>
      </section>

      <section class="card hidden" id="screen-end">
        <p class="kicker score" id="end-score"></p>
        <h2 class="end-heading" id="end-heading"></h2>
        <p class="lede" id="end-body"></p>
        <div class="score-hearts" id="score-hearts" aria-hidden="true"></div>
        <button type="button" class="btn primary" id="btn-retry">Provo sërish</button>
        <p class="footer-note" id="footer-note"></p>
      </section>
    </main>

    <script src="config.js"></script>
    <script src="app.js"></script>
  </body>
</html>
